<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#030304" />
    <title>LYNK</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      /* Экран загрузки: виден сразу, ещё до загрузки скриптов. Убирает App, когда пришёл профиль. */
      html, body { background: #050506; }
      #splash {
        position: fixed; inset: 0; z-index: 1000;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
        background: radial-gradient(60% 45% at 50% 42%, rgba(255, 255, 255, 0.07), transparent 70%), #050506;
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }
      #splash.splash--hide { opacity: 0; visibility: hidden; }
      #splash img { width: 88px; height: 88px; animation: splash-pulse 1.6s ease-in-out infinite; }
      #splash .splash-bar { position: relative; width: 120px; height: 3px; overflow: hidden; border-radius: 999px; background: rgba(255, 255, 255, 0.1); }
      #splash .splash-bar::after {
        content: ''; position: absolute; inset: 0; width: 40%; border-radius: inherit;
        background: rgba(255, 255, 255, 0.85); animation: splash-run 1.1s ease-in-out infinite;
      }
      @keyframes splash-pulse { 0%, 100% { opacity: 0.75; transform: scale(0.96); } 50% { opacity: 1; transform: scale(1); } }
      @keyframes splash-run { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #splash img, #splash .splash-bar::after { animation: none; } }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Загрузка LYNK">
      <img src="./lynk-mark.png" alt="" draggable="false" />
      <div class="splash-bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
