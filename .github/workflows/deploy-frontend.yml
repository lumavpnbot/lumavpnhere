name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Пока в репозитории нет package-lock.json (ставили пакеты вручную,
      # без доступа к npm-реестру) — без cache: npm и без npm ci, иначе
      # setup-node падает на несуществующем lock-файле.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm run build
        env:
          # Адрес бэкенда. Переменная репозитория API_URL (свой домен с прокси, infra/sub-proxy:
          # открывается без VPN), иначе Railway. Пусто = демо-режим.
          VITE_API_URL: ${{ vars.API_URL || 'https://lynk-vpn-backend-production.up.railway.app' }}
          VITE_BOT_USERNAME: lynkorobot

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
