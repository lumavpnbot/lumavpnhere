version: '3.8'

# Только окружение для разработки (БД + кэш). Сам backend/frontend
# запускаются локально через npm run dev — так удобнее для хот-релоада.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: luma
      POSTGRES_PASSWORD: luma
      POSTGRES_DB: luma_vpn
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

volumes:
  postgres_data:
